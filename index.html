<style>
:root{--blue:#01aef0;--grey:#404040;--radius:20px}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Montserrat,Verdana,sans-serif;color:var(--grey)}
.header{position:relative;width:90%;margin-left:5%;padding:26px 20px;background:var(--blue);color:#fff;text-align:center;font-size:1.25rem;font-weight:700;border-radius:0 0 24px 24px}
#btn-lang{position:absolute;top:50%;right:23px;transform:translateY(-50%);display:flex;padding:4px;border:0;background:transparent;cursor:pointer}#btn-lang svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.content{max-width:600px;margin:0 auto;padding:24px 20px 50px}.field{position:relative;margin-top:26px;padding:20px;border:1.5px solid #ccc;border-radius:var(--radius);transition:border-color .25s}.field:focus-within{border-color:var(--grey)}.field>.field-label{position:absolute;top:-8px;left:18px;padding:0 6px;background:#fff;color:var(--blue);font-size:.75rem;font-weight:700}
.field input[type=text],#firma-select{width:100%;height:20px;padding:0;border:0;outline:0;background:transparent;color:var(--grey);font:700 1rem/20px Montserrat,sans-serif}.field input[type=text]::placeholder{color:#c8c8c8;font-weight:500}

.cam-box{position:relative;width:100%;aspect-ratio:3.5/4;overflow:hidden;border-radius:calc(var(--radius) - 4px);background:#f5f5f5}#video,#photo-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}#silhouette{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}#silhouette svg{width:95%;height:auto;margin-top:25px;stroke:#fff;fill:none;opacity:.5}#countdown{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.25);color:#fff;font-size:4rem;font-weight:700;text-shadow:0 0 8px rgba(0,0,0,.5);pointer-events:none}#btn-start-cam{position:absolute;top:50%;left:50%;z-index:3;width:15rem;height:4rem;transform:translate(-50%,-50%);white-space:nowrap}.cam-buttons{display:flex;justify-content:center;margin-top:12px}.cam-buttons .btn{width:100%;height:3.5rem}
.sig-wrap{position:relative}#sigpad{display:block;width:100%;height:180px;background:#fff;border-radius:calc(var(--radius) - 4px);touch-action:none}#btn-clear-sig{position:absolute;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border:0;border-radius:50%;background:#c5c5c5}#btn-clear-sig svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

</style>
</head>

</form></div>

<script>

const firmenHaeufig=['CCF Cassella Chemiepark Frankfurt GmbH','AllessaProduktion GmbH','Allessa GmbH','BioSpring GmbH','Corden Pharma Germany GmbH','Prefere Melamines GmbH'];let gruppeHaeufig,gruppeAlle;
function fuelleFirmenListe(){selFirma.innerHTML='';const p=new Option(t('unternehmenPlatzhalter'),'');p.hidden=true;selFirma.add(p);gruppeHaeufig=document.createElement('optgroup');gruppeAlle=document.createElement('optgroup');gruppeHaeufig.label=t('haeufigGenutzt');gruppeAlle.label=t('alleUnternehmen');firmenHaeufig.forEach(x=>gruppeHaeufig.appendChild(new Option(x,x)));firmenAlle.forEach(x=>gruppeAlle.appendChild(new Option(x,x)));selFirma.append(gruppeHaeufig,gruppeAlle,new Option(t('unternehmenAndere'),'andere'));selFirma.classList.add('placeholder')}
fuelleFirmenListe();selFirma.addEventListener('change',()=>{selFirma.classList.toggle('placeholder',!selFirma.value);if(selFirma.value==='andere'){selFirma.style.display='none';inputFirmaAndere.style.display='block';inputFirmaAndere.focus()}});const getFirma=()=>selFirma.style.display==='none'?inputFirmaAndere.value.trim():selFirma.value;

const video=$('video'),preview=$('photo-preview'),silhouette=$('silhouette'),countdown=$('countdown'),photoCanvas=$('photo-canvas'),btnStart=$('btn-start-cam'),btnSnap=$('btn-snap'),btnRetake=$('btn-retake');

function getGeburtsdatum(){if(!selTag.value||!selMonat.value||!selJahr.value)return null;return selJahr.value+'-'+String(selMonat.value).padStart(2,'0')+'-'+String(selTag.value).padStart(2,'0')}function showStatus(msg,type){$('status').textContent=msg;$('status').className='status '+type}function validate(){const data={vorname:$('vorname').value.trim(),nachname:$('nachname').value.trim(),firma:getFirma(),geburtsdatum:getGeburtsdatum(),foto:photoDataUrl,unterschrift:sigCanvas.toDataURL('image/png')};if(!data.vorname||!data.nachname||!data.firma||!data.geburtsdatum){showStatus(t('errFelder'),'err');return null}if(!hasSignature){showStatus(t('errUnterschrift'),'err');return null}return data}
function formatDatum(iso){const x=iso.split('-');return x[2]+'.'+x[1]+'.'+x[0]}function alter(iso){const [y,m,d]=iso.split('-').map(Number),today=new Date();let a=today.getFullYear()-y;if(today.getMonth()<m-1||(today.getMonth()===m-1&&today.getDate()<d))a--;return a}
function buildPdf(data){const doc=new window.jspdf.jsPDF(),w=doc.internal.pageSize.getWidth(),h=doc.internal.pageSize.getHeight(),m=20,blue=[1,174,240];doc.setFillColor(...blue);doc.rect(0,0,w,32,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(22);doc.text('Anmeldeformular',w/2,21,{align:'center'});let y=50;function field(label,value){doc.setFontSize(9);doc.setTextColor(...blue);doc.text(label,m,y);y+=7;doc.setFontSize(15);doc.setTextColor(20);doc.text(value,m,y);y+=13}field('Vorname',data.vorname);field('Nachname',data.nachname);field('Unternehmen',data.firma);field('Geburtsdatum',formatDatum(data.geburtsdatum)+' ('+alter(data.geburtsdatum)+')');if(data.foto){doc.setFontSize(9);doc.setTextColor(...blue);doc.text('Foto',m,y);y+=6;const p=doc.getImageProperties(data.foto),r=Math.min(80/p.width,80/p.height),iw=p.width*r,ih=p.height*r;doc.addImage(data.foto,'JPEG',m,y,iw,ih);doc.rect(m,y,iw,ih);y+=ih+14}if(y+58>h-20){doc.addPage();y=20}doc.setFontSize(9);doc.setTextColor(...blue);doc.text('Unterschrift',m,y);y+=6;doc.roundedRect(m,y,80,32,4,4);doc.addImage(data.unterschrift,'PNG',m+4,y+3,72,26);y+=42;doc.setFont('helvetica','normal');doc.setTextColor(140);doc.text('Der Verarbeitung der Daten gemäß Datenschutzerklärung wurde zugestimmt.',m,y);const now=new Date();doc.line(m,h-18,w-m,h-18);doc.setFontSize(8);doc.text('Erstellt am '+String(now.getDate()).padStart(2,'0')+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+now.getFullYear()+' um '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'),m,h-11);return doc}
$('btn-mail').addEventListener('click',async()=>{const data=validate();if(!data)return;const btn=$('btn-mail');btn.disabled=true;btn.textContent=t('wirdGesendet');try{const pdfBase64=buildPdf(data).output('datauristring').split(',')[1],res=await fetch('submit.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vorname:data.vorname,nachname:data.nachname,firma:data.firma,geburtsdatum:data.geburtsdatum,pdfBase64})}),json=await res.json();if(!res.ok||!json.success)throw new Error(json.error||'HTTP '+res.status);$('success-overlay').classList.add('show');setTimeout(()=>{resetForm();$('success-overlay').classList.remove('show');scrollTo({top:0,behavior:'instant'})},5000)}catch(err){showStatus(t('errSendenPrefix')+err.message,'err')}finally{btn.disabled=false;btn.textContent=t('absenden')}});
function resetForm(){$('vorname').value='';$('nachname').value='';selFirma.value='';selFirma.style.display='block';selFirma.classList.add('placeholder');inputFirmaAndere.value='';inputFirmaAndere.style.display='none';[selTag,selMonat,selJahr].forEach(x=>{x.value='';x.classList.add('placeholder')});photoDataUrl=null;preview.style.display='none';preview.removeAttribute('src');video.style.display='none';silhouette.style.display='none';stopCam();btnSnap.style.display='none';btnRetake.style.display='none';btnStart.style.display='inline-block';sigCtx.clearRect(0,0,sigCanvas.width,sigCanvas.height);hasSignature=false;$('status').className='status';$('status').textContent='';currentLang='de';applyLanguage()}
let inactivityTimer,autoResetTimer;const badge=$('inactivity-badge'),INACTIVE=30000,AUTORESET=15000;function hasInput(){return $('vorname').value.trim()||$('nachname').value.trim()||getFirma()||selTag.value||selMonat.value||selJahr.value||photoDataUrl||stream||hasSignature}function restartTimer(){clearTimeout(inactivityTimer);clearTimeout(autoResetTimer);badge.classList.remove('show');if(hasInput())inactivityTimer=setTimeout(()=>{badge.classList.add('show');autoResetTimer=setTimeout(()=>{resetForm();badge.classList.remove('show');scrollTo({top:0,behavior:'instant'})},AUTORESET)},INACTIVE)}$('btn-inactivity-continue').addEventListener('click',restartTimer);$('btn-inactivity-reset').addEventListener('click',()=>{resetForm();badge.classList.remove('show');restartTimer()});['input','change','click','touchstart','mousedown','keydown'].forEach(evt=>document.addEventListener(evt,e=>{if(!badge.contains(e.target))restartTimer()},{passive:true}));window.addEventListener('beforeunload',stopCam);
})();
</script>
